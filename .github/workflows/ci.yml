name: CI / Production Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build & Test Verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Install dependencies
        run: npm install

      - name: Type check (TypeScript)
        run: npx tsc --noEmit

      - name: Code quality check (ESLint)
        run: npx eslint --quiet

      - name: Run automated test suite
        run: npm test

      - name: Build Next.js production bundle
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: https://vytjoyvphrqcntdogrng.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_D0QsRPS8zTo1vul9zHYE2g_Z0Hu56lj
